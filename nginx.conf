root /app;
port_in_redirect off;
absolute_redirect off;

# The buildpack ships no gzip defaults and nginx's own default is off, so
# without this index.html goes out uncompressed — it's ~110 kB of inline
# CSS/JS, which compresses roughly 5x. text/html needs no entry below;
# nginx always compresses it once gzip is on.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  image/svg+xml;

# Art is renamed by hand whenever it changes, so it can be cached hard.
location ~* \.(png|webp|jpe?g|gif|ico|svg|woff2?|ttf)$ {
  expires 30d;
}

location ~* \.(css|js)$ {
  expires 7d;
}

# expires -1 sends Cache-Control: no-cache, which still allows 304s — it only
# forces revalidation, so a deploy shows up immediately rather than needing a
# manual cache clear on mobile.
location / {
  try_files $uri $uri/ /index.html =404;
  expires -1;
}
