<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0a0a10" />
    <meta name="color-scheme" content="dark" />
    <title>Viewport diagnostics — AfterCare</title>
    <style>
      :root {
        --bg: #0a0a10;
        --white: #f7f7fb;
        --gray: #9aa0b4;
        --purple: #7c3aed;
        --teal: #2dd4bf;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--white);
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        min-height: 100vh;
      }
      /* Sits at document y=0. If this bar is not visible on screen, the top
         of the document is behind the browser's own chrome. */
      .doctop {
        background: var(--teal);
        color: #04231f;
        font-weight: 700;
        font-size: 13px;
        text-align: center;
        padding: 6px 4px;
      }
      /* Mirrors .a11y-widget on the real pages (position:fixed; top:16px). */
      .fixedprobe {
        position: fixed;
        top: 16px;
        right: 16px;
        background: var(--purple);
        color: #fff;
        font-weight: 700;
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 8px;
        z-index: 100;
      }
      /* Pushed well clear of the zone we suspect is occluded, so the numbers
         stay readable in a screenshot even in the failing case. */
      main {
        padding: 190px 14px 60px;
      }
      h1 {
        font-size: 15px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--gray);
        margin: 0 0 10px;
      }
      pre {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 13px;
        line-height: 1.45;
        margin: 0 0 22px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .back {
        color: var(--teal);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="doctop" id="doctop">▲ DOCUMENT TOP (y=0) — visible?</div>
    <div class="fixedprobe" id="fixedprobe">FIXED 16</div>
    <main>
      <h1>At first paint</h1>
      <pre id="first">measuring…</pre>
      <h1>Now (live)</h1>
      <pre id="live">measuring…</pre>
      <h1>Events seen</h1>
      <pre id="events">—</pre>
      <a class="back" href="../">← Back to AfterCare</a>
    </main>
    <script>
      var firstEl = document.getElementById("first");
      var liveEl = document.getElementById("live");
      var eventsEl = document.getElementById("events");
      var probe = document.getElementById("fixedprobe");
      var doctop = document.getElementById("doctop");
      var events = [];
      var frozen = false;
      // ?nudge=1 tests whether a synthetic scroll provokes the same correction
      // a real finger-scroll does. scrollY is already 0 in the broken state,
      // so scrollTo(0,0) is a no-op — it has to move away from 0 and back.
      var nudge = location.search.indexOf("nudge=1") !== -1;

      function inset(name) {
        var d = document.createElement("div");
        d.style.paddingTop = "env(" + name + ", 0px)";
        document.body.appendChild(d);
        var v = getComputedStyle(d).paddingTop;
        d.remove();
        return v;
      }

      function snapshot() {
        var vv = window.visualViewport;
        var p = probe.getBoundingClientRect();
        var t = doctop.getBoundingClientRect();
        return [
          "scrollY            " + Math.round(window.scrollY),
          "innerHeight        " + window.innerHeight,
          "clientHeight       " + document.documentElement.clientHeight,
          "screen.height      " + screen.height,
          "dpr                " + window.devicePixelRatio,
          "vv.height          " + (vv ? Math.round(vv.height) : "n/a"),
          "vv.offsetTop       " + (vv ? Math.round(vv.offsetTop) : "n/a"),
          "vv.pageTop         " + (vv ? Math.round(vv.pageTop) : "n/a"),
          "vv.scale           " + (vv ? vv.scale : "n/a"),
          "inset top/bottom   " +
            inset("safe-area-inset-top") +
            " / " +
            inset("safe-area-inset-bottom"),
          "FIXED probe .top   " + Math.round(p.top) + "  (css says 16)",
          "FIXED probe size   " + Math.round(p.width) + "x" + Math.round(p.height),
          "DOC TOP bar .top   " + Math.round(t.top) + "  (0 = at viewport top)",
          "nudge mode         " + (nudge ? "ON" : "off"),
        ].join("\n");
      }

      function render() {
        liveEl.textContent = snapshot();
        eventsEl.textContent = events.length ? events.join("\n") : "—";
      }

      function note(name) {
        var vv = window.visualViewport;
        events.push(
          name +
            " @" +
            Math.round(performance.now()) +
            "ms  scrollY=" +
            Math.round(window.scrollY) +
            " innerH=" +
            window.innerHeight +
            " vvH=" +
            (vv ? Math.round(vv.height) : "n/a") +
            " vvTop=" +
            (vv ? Math.round(vv.offsetTop) : "n/a")
        );
        if (events.length > 14) events.shift();
        render();
      }

      render();
      // Freeze the earliest stable reading so later toolbar settling can't
      // overwrite the state we actually care about.
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          if (!frozen) {
            frozen = true;
            firstEl.textContent = snapshot();
          }
          render();
        });
      });

      window.addEventListener("scroll", function () {
        note("scroll");
      });
      window.addEventListener("resize", function () {
        note("resize");
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", function () {
          note("vv:resize");
        });
        window.visualViewport.addEventListener("scroll", function () {
          note("vv:scroll");
        });
      }
      window.addEventListener("load", function () {
        note("load");
        if (nudge) {
          window.scrollTo(0, 1);
          note("nudge->1");
          requestAnimationFrame(function () {
            window.scrollTo(0, 0);
            note("nudge->0");
          });
        }
      });
      setTimeout(function () {
        note("t+1500ms");
      }, 1500);
      setTimeout(function () {
        note("t+4000ms");
      }, 4000);
    </script>
  </body>
</html>
